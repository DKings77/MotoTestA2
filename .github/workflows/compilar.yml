# ------------------------------------------------------------------
# Compila la app en un Mac de GitHub y deja un .ipa SIN FIRMAR
# como "artifact" descargable. La firma la hace Sideloadly en tu PC
# con tu Apple ID gratuito.
#
# Se ejecuta solo al hacer push a main, o a mano desde la pestaña
# Actions → "Compilar IPA" → "Run workflow".
# ------------------------------------------------------------------
name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode desde project.yml
        run: xcodegen generate

      - name: Compilar para iPhone (sin firmar)
        run: |
          set -o pipefail
          xcodebuild \
            -project MotoTestA2.xcodeproj \
            -scheme MotoTestA2 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar como .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MotoTestA2.app Payload/
          zip -qr MotoTestA2.ipa Payload

      - name: Publicar el .ipa como artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoTestA2-ipa
          path: MotoTestA2.ipa
          retention-days: 14
