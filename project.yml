# ------------------------------------------------------------------
# project.yml — Definición del proyecto para XcodeGen
#
# Como no tenemos Mac, no podemos crear el proyecto con el asistente
# de Xcode. En su lugar describimos el proyecto en este fichero de texto
# y GitHub Actions (que sí corre en macOS) ejecuta "xcodegen generate"
# para fabricar el MotoTestA2.xcodeproj antes de compilar.
# Ventaja extra: nunca hay que tocar el .xcodeproj a mano.
# ------------------------------------------------------------------
name: MotoTestA2

options:
  bundleIdPrefix: com.davidreyes
  deploymentTarget:
    iOS: "17.0"                 # versión mínima de iOS (necesaria para SwiftData)
  createIntermediateGroups: true

targets:
  MotoTestA2:
    type: application
    platform: iOS
    sources:
      - path: MotoTestA2        # todo lo que haya en esta carpeta entra en la app
    scheme: {}                  # genera el "scheme" que usa xcodebuild para compilar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidreyes.mototesta2
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"          # 1 = solo iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor   # color naranja de la app
        # Info.plist generado automáticamente a partir de estas claves:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "MotoTest A2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait   # solo vertical
